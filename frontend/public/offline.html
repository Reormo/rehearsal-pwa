<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>오프라인 · 합주 예약</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding:
        max(24px, env(safe-area-inset-top))
        max(24px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(24px, env(safe-area-inset-left));
      background: #f8fafc;
      color: #0f172a;
      font-family: Arial, Helvetica, sans-serif;
    }
    main {
      width: min(100%, 440px);
      padding: 28px;
      border: 1px solid #e2e8f0;
      border-radius: 24px;
      background: #ffffff;
      box-shadow: 0 16px 50px rgba(15, 23, 42, 0.06);
      text-align: center;
    }
    h1 { margin: 0; font-size: 1.5rem; }
    p { margin: 12px 0 0; color: #64748b; line-height: 1.6; }
    button {
      margin-top: 22px;
      min-height: 46px;
      border: 1px solid #0f172a;
      border-radius: 14px;
      background: #0f172a;
      padding: 10px 18px;
      color: #ffffff;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1>인터넷 연결이 없습니다</h1>
    <p>연결을 확인한 뒤 다시 시도해주세요. 예약과 일정 데이터는 온라인 상태에서 최신 정보를 불러옵니다.</p>
    <button type="button" onclick="location.reload()">다시 시도</button>
  </main>
</body>
</html>
