spring.application.name=rehearsal-backend

spring.profiles.default=local

app.auth.jwt-secret=${JWT_SECRET:}
app.auth.issuer=${JWT_ISSUER:rehearsal-backend}
app.auth.access-token-ttl=${ACCESS_TOKEN_TTL:15m}
app.auth.refresh-token-ttl=${REFRESH_TOKEN_TTL:30d}
app.auth.access-cookie-name=${ACCESS_COOKIE_NAME:rehearsal_access}
app.auth.refresh-cookie-name=${REFRESH_COOKIE_NAME:rehearsal_refresh}
app.auth.cookie-secure=${COOKIE_SECURE:true}
app.auth.cookie-same-site=${COOKIE_SAME_SITE:Strict}
app.auth.frontend-origin=${FRONTEND_ORIGIN:http://localhost:3000}

app.bootstrap.club-name=${INITIAL_CLUB_NAME:밴드 동아리}
app.bootstrap.initial-admin-login-id=${INITIAL_ADMIN_LOGIN_ID:}
app.bootstrap.initial-admin-password=${INITIAL_ADMIN_PASSWORD:}
app.bootstrap.initial-admin-name=${INITIAL_ADMIN_NAME:}

app.notifications.scheduler-enabled=${NOTIFICATION_SCHEDULER_ENABLED:true}
app.notifications.scheduler-delay-ms=${NOTIFICATION_SCHEDULER_DELAY_MS:30000}
app.notifications.scheduler-initial-delay-ms=${NOTIFICATION_SCHEDULER_INITIAL_DELAY_MS:10000}
app.notifications.vapid-public-key=${WEB_PUSH_VAPID_PUBLIC_KEY:}
app.notifications.vapid-private-key=${WEB_PUSH_VAPID_PRIVATE_KEY:}
app.notifications.vapid-subject=${WEB_PUSH_VAPID_SUBJECT:mailto:admin@example.com}
